<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 영화 티어리스트</title>
  <style>
    :root { --paper:#faf8f3; --ink:#242922; --muted:#5f685d; --line:#d9dad1; --green:#276453; --sage:#e3eee7; --peach:#f2e6dc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:system-ui,-apple-system,sans-serif; line-height:1.6; }
    main { width:min(100% - 32px,860px); margin:32px auto 48px; }
    header { display:flex; align-items:start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    h1 { margin:0; font-size:clamp(26px,5vw,34px); line-height:1.25; letter-spacing:-.03em; }
    .sub { margin:10px 0 0; color:var(--muted); max-width:46ch; }
    .tools { display:flex; flex-wrap:wrap; gap:8px; width:100%; margin-top:20px; }
    .tools input { min-width:0; flex:1 1 160px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; }
    button { font:inherit; cursor:pointer; }
    .tools button { padding:10px 15px; border:1px solid var(--green); border-radius:12px; font-weight:700; background:var(--green); color:#fff; }
    .tools .reset { color:var(--green); background:#fff; }
    #message { min-height:26px; margin:14px 0; font-size:14px; color:var(--muted); }
    .tiers { display:grid; gap:10px; }
    .row { display:flex; min-height:90px; background:#fff; border:1.5px solid var(--line); border-radius:14px; overflow:hidden; }
    .row.over { outline:3px solid var(--green); outline-offset:1px; }
    .label { width:64px; flex-shrink:0; border:0; color:white; font-size:26px; font-weight:800; padding:12px 4px; }
    .S .label { background:#a55239; } .A .label { background:#b4763e; } .B .label { background:#276453; } .C .label { background:#67725d; }
    .drop { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:9px; padding:12px; min-height:88px; }
    .pool { margin-top:22px; }
    .pool-head { margin:0 0 8px; border:0; padding:0; background:transparent; color:var(--muted); font-size:17px; font-weight:700; text-align:left; }
    #pool { border:1.5px dashed var(--line); border-radius:14px; background:#fff; }

    /* 카드 및 한 줄 메모 스타일 */
    .card {
      width:132px;
      min-height:74px;
      padding:8px;
      border:1px solid rgba(36,41,34,0.08);
      border-radius:10px;
      color:var(--ink);
      cursor:grab;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:6px;
      transition:transform 0.1s ease;
    }
    .card:active { cursor:grabbing; }
    .card[aria-pressed="true"] { outline:3px solid var(--green); outline-offset:2px; }
    .card-title {
      font-size:14px;
      font-weight:650;
      line-height:1.3;
      overflow-wrap:anywhere;
    }
    .card-memo-btn {
      display:block;
      width:100%;
      text-align:left;
      background:rgba(255,255,255,0.58);
      border:1px dashed rgba(36,41,34,0.22);
      border-radius:6px;
      padding:3px 6px;
      font-size:11.5px;
      line-height:1.3;
      color:var(--ink);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .card-memo-btn:hover {
      background:rgba(255,255,255,0.92);
      border-color:var(--green);
    }
    .card-memo-btn.empty {
      color:var(--muted);
    }
    .card-memo-input {
      width:100%;
      border:1.5px solid var(--green);
      border-radius:6px;
      padding:3px 6px;
      font:inherit;
      font-size:11.5px;
      line-height:1.3;
      background:#fff;
      color:var(--ink);
    }

    .count { display:block; font-size:14px; font-weight:600; }
    .note { font-size:13px; color:var(--muted); margin-top:18px; }
    :focus-visible { outline:3px solid #ba613a; outline-offset:3px; }
    @media(max-width:420px) {
      .label { width:48px; }
      .card { width:112px; padding:7px; }
      .drop { padding:10px; gap:8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>내 영화 티어리스트</h1>
        <p class="sub">영화를 선택한 뒤 옮길 등급 글자를 눌러 주세요. 카드를 끌어서 놓아도 되며, 카드 하단을 눌러 한 줄 메모를 남길 수 있습니다.</p>
      </div>
    </header>
    <form class="tools" id="add-form">
      <input id="title" aria-label="영화 제목" placeholder="영화 제목 추가" maxlength="80">
      <button type="submit">추가</button>
      <button type="button" class="reset" id="reset">처음으로</button>
    </form>
    <p id="message" role="status">영화를 선택해 S·A·B·C로 나누어 보세요.</p>
    <section class="tiers" id="tiers" aria-label="영화 등급"></section>
    <section class="pool" aria-label="아직 안 정한 영화">
      <button class="pool-head" id="pool-label" type="button" aria-label="미분류로 옮기기">아직 안 정한 영화</button>
      <div class="drop" id="pool" data-tier="pool"></div>
    </section>
    <p class="note">같은 브라우저에서 이 파일을 다시 열면 정리한 목록과 메모가 남습니다. 다른 사람에게 파일을 보내도 내 입력 내역까지 전달되지는 않습니다.</p>
  </main>
  <script>
    const KEY = "codyssey-activity-02-v3";
    const LEVELS = ['S', 'A', 'B', 'C', 'pool'];
    const TITLES = ["기생충","인터스텔라","라라랜드","센과 치히로의 행방불명","어벤져스: 엔드게임","범죄도시","타이타닉","토이 스토리"];
    const COLORS = ["#f2e6dc","#e3eee7","#ede7f6","#fcefd9","#e2ecf4","#f6e3e3"];
    const initial = () => ({
      nextId: TITLES.length + 1,
      items: TITLES.map(title => ({ id: title, title, tier: 'pool', memo: '' }))
    });

    let state = initial();
    let selected = null;
    let editingMemoId = null;

    try {
      const stored = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (
        stored &&
        Number.isSafeInteger(stored.nextId) &&
        Array.isArray(stored.items) &&
        stored.items.every(item => typeof item.id === 'string' && typeof item.title === 'string' && LEVELS.includes(item.tier))
      ) {
        state = {
          nextId: stored.nextId,
          items: stored.items.map(item => ({
            ...item,
            memo: typeof item.memo === 'string' ? item.memo : ''
          }))
        };
      }
    } catch {}

    function showMessage(message) {
      document.querySelector('#message').textContent = message;
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch {
        showMessage('이 브라우저에서는 저장하지 못했어요. 현재 화면에서 확인한 내용과 다시 열어 확인한 내용을 구분해 주세요.');
      }
    }

    function move(id, tier) {
      const item = state.items.find(item => item.id === id);
      if (!item || !LEVELS.includes(tier)) return;
      item.tier = tier;
      selected = null;
      editingMemoId = null;
      save();
      render();
      showMessage((item.title || '영화') + '를 옮겼어요.');
    }

    function card(item, index) {
      const element = document.createElement('div');
      element.className = 'card';
      element.setAttribute('role', 'button');
      element.setAttribute('tabindex', '0');
      element.setAttribute('draggable', 'true');
      element.dataset.id = item.id;
      element.style.backgroundColor = COLORS[index % COLORS.length];
      element.setAttribute('aria-pressed', String(selected === item.id));

      const titleEl = document.createElement('div');
      titleEl.className = 'card-title';
      titleEl.textContent = item.title;
      element.appendChild(titleEl);

      if (editingMemoId === item.id) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'card-memo-input';
        input.value = item.memo || '';
        input.maxLength = 40;
        input.placeholder = '한 줄 메모 (최대 40자)';
        input.setAttribute('aria-label', item.title + ' 한 줄 메모 입력');

        let committed = false;
        const commitMemo = (shouldSave) => {
          if (committed) return;
          committed = true;
          editingMemoId = null;
          if (shouldSave) {
            const nextMemo = input.value.trim();
            if (item.memo !== nextMemo) {
              item.memo = nextMemo;
              save();
              showMessage(nextMemo ? '한 줄 메모를 저장했어요.' : '메모를 지웠어요.');
            }
          }
          render();
        };

        input.addEventListener('click', e => e.stopPropagation());
        input.addEventListener('keydown', e => {
          e.stopPropagation();
          if (e.key === 'Enter') {
            e.preventDefault();
            commitMemo(true);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            commitMemo(false);
          }
        });
        input.addEventListener('blur', () => commitMemo(true));

        element.appendChild(input);
        requestAnimationFrame(() => {
          input.focus();
          input.select();
        });
      } else {
        const memoBtn = document.createElement('button');
        memoBtn.type = 'button';
        memoBtn.className = 'card-memo-btn' + (item.memo ? '' : ' empty');
        memoBtn.textContent = item.memo || '+ 한 줄 메모';
        memoBtn.title = item.memo ? item.memo + ' (클릭하여 수정)' : '한 줄 메모 작성';
        memoBtn.setAttribute('aria-label', item.title + (item.memo ? ' 메모 수정: ' + item.memo : ' 한 줄 메모 작성'));

        memoBtn.addEventListener('click', event => {
          event.stopPropagation();
          editingMemoId = item.id;
          render();
        });

        element.appendChild(memoBtn);
      }

      const toggleSelect = () => {
        if (editingMemoId === item.id) return;
        const targetItem = state.items.find(i => i.id === item.id);
        if (!targetItem) return;
        selected = selected === targetItem.id ? null : targetItem.id;
        render();
        showMessage(selected ? targetItem.title + '를 선택했어요.' : '선택을 해제했어요.');
      };

      element.addEventListener('click', event => {
        event.stopPropagation();
        toggleSelect();
      });

      element.addEventListener('keydown', event => {
        if (event.target !== element) return;
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleSelect();
        }
      });

      element.addEventListener('dragstart', event => {
        if (editingMemoId === item.id) {
          event.preventDefault();
          return;
        }
        event.dataTransfer.setData('text/plain', item.id);
      });

      return element;
    }

    function wireDrop(element, tier) {
      element.addEventListener('dragover', event => {
        event.preventDefault();
        element.closest('.row')?.classList.add('over');
      });
      element.addEventListener('dragleave', () => element.closest('.row')?.classList.remove('over'));
      element.addEventListener('drop', event => {
        event.preventDefault();
        element.closest('.row')?.classList.remove('over');
        move(event.dataTransfer.getData('text/plain'), tier);
      });
      element.onclick = () => {
        if (selected) move(selected, tier);
      };
    }

    function render() {
      const tiers = document.querySelector('#tiers');
      tiers.replaceChildren();
      for (const tier of LEVELS.filter(value => value !== 'pool')) {
        const row = document.createElement('div');
        row.className = 'row ' + tier;

        const label = document.createElement('button');
        label.type = 'button';
        label.className = 'label';
        label.textContent = tier;
        label.setAttribute('aria-label', tier + '등급으로 옮기기');
        label.addEventListener('click', () => {
          if (selected) move(selected, tier);
          else showMessage('먼저 영화 카드를 선택해 주세요.');
        });

        const drop = document.createElement('div');
        drop.className = 'drop';
        drop.dataset.tier = tier;
        state.items.forEach((item, index) => {
          if (item.tier === tier) drop.append(card(item, index));
        });

        wireDrop(drop, tier);
        row.append(label, drop);
        tiers.append(row);
      }

      const pool = document.querySelector('#pool');
      pool.replaceChildren();
      state.items.forEach((item, index) => {
        if (item.tier === 'pool') pool.append(card(item, index));
      });
    }

    wireDrop(document.querySelector('#pool'), 'pool');

    document.querySelector('#pool-label').addEventListener('click', () => {
      if (selected) move(selected, 'pool');
      else showMessage('먼저 영화 카드를 선택해 주세요.');
    });

    document.querySelector('#add-form').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.querySelector('#title');
      const title = input.value.trim();
      if (!title) {
        showMessage('영화 제목을 입력해 주세요.');
        input.focus();
        return;
      }
      if (state.items.some(item => item.title === title)) {
        showMessage('이미 있는 영화 제목이에요. 다른 제목을 넣어 주세요.');
        return;
      }
      state.items.push({ id: title, title, tier: 'pool', memo: '' });
      save();
      render();
      input.value = '';
      showMessage('영화를 추가했어요.');
      input.focus();
    });

    document.querySelector('#reset').addEventListener('click', () => {
      state = initial();
      selected = null;
      editingMemoId = null;
      document.querySelector('#title').value = '';
      save();
      render();
      showMessage('처음 목록으로 돌아왔어요.');
    });

    render();
  </script>
</body>
</html>
